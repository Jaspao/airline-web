<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈ Jaspair</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar no-print">
        <h1>✈ Jaspair</h1>
        <nav id="user-nav" hidden>
            <span id="user-name"></span>
            <button id="btn-flights" class="link" type="button">Flights</button>
            <button id="btn-mytickets" class="link" type="button">My tickets</button>
            <button id="btn-logout" class="link" type="button">Log Out</button>
        </nav>
    </header>
    
    <ol id="stepper" class="stepper no-print" hidden>
        <li data-step="1">Flight</li>
        <li data-step="2">Passenger</li>
        <li data-step="3">Seat</li>
        <li data-step="4">Baggage</li>
        <li data-step="5">Ticket</li>
    </ol>

    <main>
        <section id="login-view" class="view card narrow">
            <h2>Log in</h2>
            <form id="login-form" novalidate>
                <label>Username
                    <input id="login-username" type="text" autocomplete="username" required>
                </label>
                <label>Password
                    <input id="login-password" type="password" autocomplete="current-password" required>
                </label>
                <p id="login-error" class="error" role="alert"></p>
                <button class="btn primary" type="submit">Log in</button>
            </form>
            <p class="hint">Demo account: <code>demo</code> / <code>1234</code></p>
        </section>

        <section id="flights-view" class="view" hidden>
            <h2>Available flights</h2>
            <div class="filters card">
                <label>From 
                    <select id="filter-from"></select>
                </label>
                <label>To
                    <select id="filter-to"></select>
                </label>
            </div>
            <div id="flight-list" class="flight-list"></div>
        </section>

            <!-- PASSENGER -->
        <section id="booking-view" class="view card narrow" hidden>
            <h2>Passenger details</h2>
            <div id="booking-flight" class="summary"></div>
            <form id="passenger-form" novalidate>
                <label>Full name (as on passport)
                    <input id="passenger-name" type="text" required>
                </label>
                <p id="passenger-error" class="error" role="alert"></p>
                <div class="actions">
                    <button class="btn" type="button" data-back="flights">Back</button>
                    <button class="btn primary" type="submit">Choose seat</button>
                </div>
            </form>
        </section>

    <!-- SEATS -->
        <section id="seats-view" class="view card" hidden>
            <h2>Choose your seat</h2>
            <div id="seats-flight" class="summary"></div>
            <div class="legend">
                <span><i class="swatch free"></i> Available</span>
                <span><i class="swatch legroom"></i> Extra legroom (+$15)</span>
                <span><i class="swatch taken"></i> Taken</span>
                <span><i class="swatch selected"></i> Your seat</span>
            </div>
            <div id="seat-map" class="seat-map" aria-label="Seat map"></div>
            <p id="seat-selected" class="selected-text">No seat selected</p>
            <div class="actions">
                <button class="btn" type="button" data-back="booking">Back</button>
                <button id="seats-next" class="btn primary" type="button" disabled>Choose baggage</button>
            </div>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
